[project]
name = "edusphere-ai-core"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1",
    "uvicorn>=0.38.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "firebase-admin>=6.0.0",
    "greenlet>=3.2.4",
    "requests>=2.31.0",
    "pdfplumber>=0.11.8",
    "ollama>=0.1.0",
    "pandas>=2.3.3",
    "transformers>=4.57.3",
    "gliner>=0.2.24",
    "pandas-stubs==2.3.3.251201",
    "nltk>=3.9.2",
    "scikit-learn>=1.8.0",
    "pymupdf>=1.26.6",
    "supabase>=2.3.0",
    "aiosqlite>=0.22.1",
    "motor>=3.7.1",
    "google-cloud-firestore>=2.21.0",
]

[project.scripts]
extract = "features.extraction:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["features", "models", "services", "utils", "config"]
namespaces = false

[tool.uv]
package = true